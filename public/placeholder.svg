    <path d="M0 -62 C 34 -96, 84 -96, 70 -60 C 60 -36, 22 -50, 0 -62 Z" fill="#FFF9F0"/>
    <circle cx="0" cy="-62" r="12" fill="#E060A8"/>
  </g>

  <text x="200" y="322" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
